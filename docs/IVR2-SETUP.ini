; דוגמת הגדרות לשלוחת API בימות המשיח — IVR2
; החלף את כתובת Render ואת YOUR_ACCESS_KEY.
; צור ב-Render משתנה ACCESS_KEY והעתק את הערך שנוצר להגדרה key.

type=api
title=עוזר AI טלפוני
api_link=https://zygy-voice-ai-zoo8.onrender.com/run_transcription
api_add_0=key=YOUR_ACCESS_KEY

; כל הקלטה נשמרת בשלוחה /07/api בשם קובץ אוטומטי.
; יש ליצור את תיקיית ההקלטות לפי הנתיב שלך במערכת.
api_000=rapi,,record,/07/api,,no

; שליחת מזהה שיחה ומספר טלפון, לצורך שמירת הקשר בין פניות באותה שיחה.
api_call_id_send=yes
api_phone_send=yes
api_did_send=no
api_enter_id_send=no
api_enter_id_name_send=no
api_time_send=no
api_hangup_send=no

; חזרה לאותה שלוחה לאחר תשובת השרת כדי לאפשר שיחה מתמשכת.
api_end_goto=.

; במידת הצורך אפשר להפעיל מוזיקת המתנה בזמן תמלול ויצירת תשובה:
; api_wait_answer_music_on_hold=yes
